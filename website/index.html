<!DOCTYPE html>
<html lang="en">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Render Roar | 360° Virtual Tour</title>


    <!-- PANNELLUM CSS -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    >


    <!-- PANNELLUM JAVASCRIPT -->

    <script
        src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"
    ></script>

    
    <style>


        /* =========================================
           BASIC PAGE
        ========================================= */

        html,
        body {

            margin: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;

        }


        /* =========================================
           PANORAMA
        ========================================= */

        #panorama {

            width: 100%;

            height: 100%;

        }


        /* =========================================
           INSTRUCTION
        ========================================= */

        #instruction {

            position: absolute;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            padding: 10px 18px;

            background: rgba(0, 0, 0, 0.55);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 14px;

            border-radius: 20px;

            z-index: 10;

            pointer-events: none;

            transition: opacity 0.5s;

        }


        /* =========================================
           DESTINATION BAR
        ========================================= */

        #destinations {

            position: absolute;

            bottom: 20px;

            left: 50%;

            transform: translateX(-50%);

            display: flex;

            gap: 8px;

            padding: 8px;

            background: rgba(0, 0, 0, 0.75);

            border-radius: 6px;

            z-index: 40;

        }
        #toggle-destinations {
    position: static;
    width: 36px;
    min-width: 36px;
    height: 60px;
    align-self: center;
    border: none;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    font-size: 24px;
    cursor: pointer;
}


        /* =========================================
           DESTINATION THUMBNAIL
        ========================================= */

        .destination {

            width: 110px;

            cursor: pointer;

            position: relative;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;

        }


        .destination:hover {

            transform: scale(1.05);

        }


        /* =========================================
           DESTINATION IMAGE
        ========================================= */

        .destination img {

            width: 110px;

            height: 70px;

            object-fit: cover;

            display: block;

            border-radius: 3px;

        }


        /* =========================================
           DESTINATION NAME
        ========================================= */

        .destination-name {

            position: absolute;

            bottom: 0;

            left: 0;

            right: 0;

            padding: 5px 4px;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 12px;

            text-align: center;

            border-radius: 0 0 3px 3px;

        }


        /* =========================================
           CURRENT LOCATION
        ========================================= */

        .destination.current {

            outline: 3px solid white;

            outline-offset: 2px;

            transform: scale(1.05);

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            #destinations {

                max-width: calc(100% - 20px);

                overflow-x: auto;

                justify-content: flex-start;

            }


            .destination {

                flex-shrink: 0;

                width: 90px;

            }


            .destination img {

                width: 90px;

                height: 60px;

            }

        }


@media (min-width: 2000px) {
    .destination {
        width: 140px;
    }

    #destinations {
        gap: 12px;
        padding: 12px;
    }
    .destination-name {
        font-size: 18px;
        padding: 7px 4px;
    }
    .destination img {
    width: 100%;
    height: 100px;
    object-fit: cover;
}
}
#welcome-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.35);
}

.welcome-content {
    text-align: center;
    color: white;
    padding: 25px;
}

.welcome-content h1 {
    font-size: clamp(18px, 3vw, 32px);
    margin-bottom: 25px;
    text-align: center;
    padding: 0 15px;
}
#start-tour {
    padding: 15px 38px;
    font-size: 16px;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 30px;
    background: white;
    color: #111;
    cursor: pointer;
    transition: all 0.3s ease;
}

#start-tour:hover {
    background: transparent;
    color: white;
    transform: scale(1.05);
}
.welcome-content {
    animation: welcomeFade 1.2s ease-out;
}

@keyframes welcomeFade {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
#mini-map {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 350px;
    height: 260px;
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 10px;
    padding: 8px;
    z-index: 50;
}

#mini-map img {
    display: block;
    width: 100%;
    height: 260px;
    object-fit: contain;
    border-radius: 5px;
}

#map-toggle {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    font-size: 20px;
    cursor: pointer;
    z-index: 2;
}
#mini-map.collapsed img {
    display: none;
}

#mini-map.collapsed {
    width: 36px;
    height: 36px;
    padding: 4px;
}
#map-title {
    color: white;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-align: center;
    padding: 0 0 2px;
    margin: 0;
}
#mini-map.collapsed {
    width: auto;
    height: auto;
    min-width: 40px;
    min-height: 40px;
    padding: 4px;
}

#mini-map.collapsed #map-title,
#mini-map.collapsed img {
    display: none;
}

#mini-map.collapsed #map-toggle {
    position: static;
    display: block;
    margin: 0 auto;
}
#mini-map.collapsed {
    display: flex;
    align-items: center;
    justify-content: center;
}

#mini-map.collapsed #map-toggle {
    position: static;
    margin: 0;
}
#mini-map {
    position: fixed;
}

#room-markers {
    position: absolute;
    left: 8px;
    right: 8px;
    top: 65px;
    bottom: 8px;
    pointer-events: none;
}

.room-marker {
    position: absolute;
    border: 2px solid transparent;
    border-radius: 5px;
    background: transparent;
    box-sizing: border-box;
    transition: 0.3s;
}
.room-marker.active {
    width: 20px;
    height: 20px;
    background: white;
    border: 7px solid #168BFF;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(22, 139, 255, 0.7);
    transform: translate(-50%, -50%);
}
/* INITIAL ROOM POSITIONS */

.room-marker[data-scene="mbr"] {
    left: 84%;
    top: 65%;
    width: 0;
    height: 0;
}

.room-marker[data-scene="br1"] {
    left: 71%;
    top: 21%;
    width: 0;
    height: 0;
}

.room-marker[data-scene="br2"] {
    left: 51%;
    top: 21%;
    width: 0;
    height: 0;
}

.room-marker[data-scene="living"] {
    left: 11%;
    top: 35%;
    width: 0;
    height: 0;
}

.room-marker[data-scene="dining"] {
    left: 28%;
    top: 27%;
    width: 0;
    height: 0%;
}

.room-marker[data-scene="hallway"] {
    left: 50%;
    top: 49%;
    width: 0%;
    height: 0;
}

.room-marker[data-scene="kitchen"] {
    left: 27%;
    top: 67%;
    width: 0;
    height: 0;
}

.room-marker[data-scene="bathroom"] {
    left: 54%;
    top: 70%;
    width: 0;
    height: 0;
}

.room-marker[data-scene="utility"] {
    left: 43%;
    top: 70%;
    width: 0;
    height: 0;
}
#mini-map.collapsed .room-marker {
    display: none;
}
@media (max-width: 600px) {
    #mini-map {
        width: 200px;
        height: 130px;
        bottom: 10px;
        left: 10px;
        padding: 5px;
    }

    #mini-map img {
        height: 130px;
    }

    #map-title {
        font-size: 10px;
    }
}
    </style>

</head>


<body>


    <!-- =========================================
         PANORAMA
    ========================================== -->

    <div id="panorama"></div>
    <div id="mini-map">
    <button id="map-toggle" type="button">−</button>
    <div id="map-title">MINI MAP</div>
    <img src="panos/floor-map.webp" alt="Apartment floor plan">
    <div id="room-markers">
    <div class="room-marker" data-scene="living"></div>
    <div class="room-marker" data-scene="dining"></div>
    <div class="room-marker" data-scene="kitchen"></div>
    <div class="room-marker" data-scene="utility"></div>
    <div class="room-marker" data-scene="hallway"></div>
    <div class="room-marker" data-scene="bathroom"></div>
    <div class="room-marker" data-scene="mbr"></div>
    <div class="room-marker" data-scene="br1"></div>
    <div class="room-marker" data-scene="br2"></div>
</div>
</div>
    <button id="toggle-destinations" type="button">⌄</button>
    <div id="welcome-screen">
    <div class="welcome-content">
        <h1>Click to Explore Your Virtual Tour</h1>
        <button id="start-tour">Start Tour</button>
    </div>
</div>


    <!-- =========================================
         INSTRUCTION
    ========================================== -->

    <div id="instruction">

        Drag to look around • Select a room below to explore

    </div>


    <!-- =========================================
         DESTINATION BAR
    ========================================== -->

    <div id="destinations"></div>


    <script>


        /* =========================================
           CURRENT LOCATION
        ========================================= */

        let currentScene = "living";
        function updateMiniMap() {
    document.querySelectorAll(".room-marker").forEach(marker => {
        marker.classList.toggle(
            "active",
            marker.dataset.scene === currentScene
        );
    });
}

updateMiniMap();


        /* =========================================
           CREATE PANNELLUM VIEWER
        ========================================= */
const responsiveHfov =
    window.innerWidth <= 350 ? 60 :
    window.innerWidth <= 400 ? 65 :
    window.innerWidth <= 600 ? 70 :
    window.innerWidth <= 1200 ? 95 :
    115;
        const viewer = pannellum.viewer(
            "panorama",
            {

                default: {

                    firstScene: "living",

                    sceneFadeDuration: 1200

                },


                scenes: {




                    /* =================================
                       LIVING
                    ================================= */

                    living: {

                        type: "equirectangular",

                        panorama: "panos/Living.webp",

                        autoLoad: true,

                        hfov: responsiveHfov

                    },


                    /* =================================
                       DINING
                    ================================= */

                    dining: {

                        type: "equirectangular",

                        panorama: "panos/Dining.webp",

                        autoLoad: true,

                        hfov: responsiveHfov

                    },


                    /* =================================
                       KITCHEN
                    ================================= */

                    kitchen: {

                        type: "equirectangular",

                        panorama: "panos/Kitchen.webp",

                        autoLoad: true,

                        hfov: responsiveHfov

                    },

                    br1: {
                        type: "equirectangular",
                        panorama: "panos/br1.webp",
                        autoLoad: true,
                        hfov: responsiveHfov
                    },

                    br2: {
                        type: "equirectangular",
                        panorama: "panos/br2.webp",
                        autoLoad: true,
                        hfov: responsiveHfov
                    },

                    mbr: {
                        type: "equirectangular",
                        panorama: "panos/Mbr.webp",
                        autoLoad: true,
                        hfov: responsiveHfov
                    },

                    bathroom: {
                        type: "equirectangular",
                        panorama: "panos/Bathroom.webp",
                        autoLoad: true,
                        hfov: responsiveHfov
                    },

                    hallway: {
                        type: "equirectangular",
                        panorama: "panos/Hallway.webp",
                        autoLoad: true,
                        hfov: responsiveHfov
                    },

                    utility: {
                        type: "equirectangular",
                        panorama: "panos/Utility.webp",
                        autoLoad: true,
                        hfov: responsiveHfov
                    }
                }

            }
        );
        document.getElementById("start-tour").addEventListener("click", () => {
    document.getElementById("welcome-screen").style.display = "none";
});
const destinations = document.getElementById("destinations");
const toggleButton = document.getElementById("toggle-destinations");
destinations.appendChild(toggleButton);
toggleButton.addEventListener("click", () => {
    const thumbnails = destinations.querySelectorAll(".destination");
    const areHidden = thumbnails.length > 0 &&
        thumbnails[0].style.display === "none";

    thumbnails.forEach(item => {
        item.style.display = areHidden ? "" : "none";
    });

    toggleButton.textContent = areHidden ? "⌄" : "⌃";
});
window.addEventListener("resize", () => {
    const newHfov =
        window.innerWidth <= 350 ? 60 :
        window.innerWidth <= 400 ? 65 :
        window.innerWidth <= 600 ? 70 :
        window.innerWidth <= 1200 ? 95 :
        115;

    viewer.setHfov(newHfov);
    viewer.resize();
});
document.addEventListener("fullscreenchange", () => {
    const fullscreenElement = document.fullscreenElement;
    const destinations = document.getElementById("destinations");
    const toggleButton = document.getElementById("toggle-destinations");

    if (fullscreenElement) {
        fullscreenElement.appendChild(destinations);
        
    } else {
        document.body.appendChild(destinations);
        
    }
});


        /* =========================================
           MOVE TO ANOTHER SCENE
        ========================================= */

        function moveToScene(sceneName) {


            /*
             * Remember current view.
             */

            const currentPitch =
                viewer.getPitch();


            const currentHfov =
                viewer.getHfov();


            /*
             * Load new panorama.
             *
             * We keep the same yaw so the
             * transition feels continuous.
             */

            const currentYaw =
                viewer.getYaw();


            viewer.loadScene(

                sceneName

            );


            /*
             * Update current location.
             */

            currentScene =
                sceneName;
                updateMiniMap();


            /*
             * Update thumbnails.
             */

            updateDestinations();

        }


        /* =========================================
           UPDATE DESTINATION BAR
        ========================================= */

        function updateDestinations() {


            const destinations =
                document.getElementById(
                    "destinations"
                );


            /*
             * Clear old thumbnails.
             */

            destinations.querySelectorAll(".destination").forEach(item => item.remove());


            /*
             * ALWAYS SHOW ALL TEN LOCATIONS
             */

            const availableDestinations = [

                { name: "Living", scene: "living", image: "panos/Living.webp" },
                { name: "Dining", scene: "dining", image: "panos/Dining.webp" },
                { name: "Kitchen", scene: "kitchen", image: "panos/Kitchen.webp" },
                { name: "Utility", scene: "utility", image: "panos/Utility.webp" },
                { name: "Hallway", scene: "hallway", image: "panos/Hallway.webp" },
                { name: "Bathroom", scene: "bathroom", image: "panos/Bathroom.webp" },
                { name: "Master Bedroom", scene: "mbr", image: "panos/Mbr.webp" },
                { name: "Bedroom 1", scene: "br1", image: "panos/br1.webp" },
                { name: "Bedroom 2", scene: "br2", image: "panos/br2.webp" }
                

            ];


            /*
             * Create thumbnails.
             */

            availableDestinations.forEach(
                function(destination) {


                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "destination";


                    /*
                     * Highlight current room.
                     */

                    if (
                        destination.scene ===
                        currentScene
                    ) {

                        item.classList.add(
                            "current"
                        );

                    }


                    /*
                     * Create image + label.
                     */

                    item.innerHTML = `

                        <img
                            src="${destination.image}"
                            alt="${destination.name}"
                        >

                        <div class="destination-name">

                            ${destination.name}

                        </div>

                    `;


                    /*
                     * Thumbnail click.
                     */

                    item.addEventListener(
                        "click",
                        function() {


                            /*
                             * Don't reload the
                             * current panorama.
                             */

                            if (
                                destination.scene ===
                                currentScene
                            ) {

                                return;

                            }


                            /*
                             * Move to destination.
                             */

                            moveToScene(
                                destination.scene
                            );

                        }
                    );


                    /*
                     * Add thumbnail to bar.
                     */

                    destinations.appendChild(item);

                }
            );
            destinations.appendChild(
                document.getElementById("toggle-destinations")
            );
        }


        /* =========================================
           HIDE INSTRUCTION
        ========================================= */

        setTimeout(
            function() {

                document.getElementById(
                    "instruction"
                ).style.opacity = "0";

            },
            4000
        );


        /* =========================================
           INITIAL DESTINATION BAR
        ========================================= */

        updateDestinations();

const miniMap = document.getElementById("mini-map");
const mapToggle = document.getElementById("map-toggle");

mapToggle.addEventListener("click", () => {
    const isCollapsed = miniMap.classList.toggle("collapsed");
    mapToggle.textContent = isCollapsed ? "+" : "−";
});
    </script>


</body>

</html>
